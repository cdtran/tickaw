services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - ./apps/api:/app
      - ./packages:/opt/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
  profiling-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    command: ["python", "-m", "app.workers.profiling"]
    user: "1000:1000"
    read_only: true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:size=134217728,mode=1777
    volumes:
      - ./apps/api:/app:ro
      - ./packages:/opt/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports: ["${WEB_PORT:-5173}:5173"]
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: data_notebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_notebook"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
