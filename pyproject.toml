[project]
name = "data-notebook"
version = "0.1.0"
description = "AI-assisted notebook analysis for uploaded tabular data"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "boto3>=1.36",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "openpyxl>=3.1",
  "redis>=5.0",
  "celery>=5.4",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
